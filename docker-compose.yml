# Local PostgreSQL (16-ortamlar-ve-yayin §4). Keep the major version equal to Neon's.
# docker compose up -d  →  postgres://app:app@localhost:5434/app  (tests: app_test). Host port 5434: 5432/5433 are used by other local projects.
name: nail-art-studio
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      TZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
