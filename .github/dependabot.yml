# Dependency updates (15-git-ve-ci §6): weekly, grouped, with a cooldown before new versions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message: { prefix: build, prefix-development: build, include: scope }
    open-pull-requests-limit: 5
    ignore:
      # Types follow the runtime: Node 24 (.nvmrc, engines). Bump together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 3 }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: ci }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    ignore:
      # Local PostgreSQL matches Neon's major version (16-ortamlar-ve-yayin §4).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
