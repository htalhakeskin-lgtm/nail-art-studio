# Supply-chain protections (15-git-ve-ci §6). Single-package repo: no `packages` list needed.

# Do not install versions published less than 3 days ago (minutes). create-next-app@latest
# may pick a release that is only hours old: pin the newest version older than 3 days instead
# (see iskelet/README.md, step 1) or add a dated, justified minimumReleaseAgeExclude entry.
minimumReleaseAge: 4320
# minimumReleaseAgeExclude:
#   - some-package   # urgent security fix — PR link and date

# Install scripts are blocked unless listed (pnpm 12: `allowBuilds`, replaces
# `ignoredBuiltDependencies` / `onlyBuiltDependencies`). These packages work without theirs:
allowBuilds:
  sharp: false # prebuilt binaries ship as optional dependencies
  unrs-resolver: false # same
  lefthook: false # hooks are installed by the "prepare" script instead
  esbuild: false # platform binary ships as an optional dependency

# Temporary audit exemptions (15-git-ve-ci §6): reason + date, reviewed by the date below.
auditConfig:
  ignoreGhsas:
    # braces ≤ 3.0.3 (high, ReDoS-style stack exhaustion). Dev-only path:
    # eslint-config-next → @next/eslint-plugin-next → fast-glob → micromatch → braces.
    # No patched version exists (2026-10-16). Runs only on our own lint globs, never on user input.
    # Review: 2026-11-16 or when eslint-config-next / braces ships a fix.
    - GHSA-vfj7-8cjw-p6xm
