# Supply-chain protections (15-git-ve-ci §6). Single-package repo: no `packages` list needed.

# Do not install versions published less than 3 days ago (minutes). create-next-app@latest
# may pick a release that is only hours old: pin the newest version older than 3 days instead
# (see iskelet/README.md, step 1) or add a dated, justified minimumReleaseAgeExclude entry.
minimumReleaseAge: 4320
# minimumReleaseAgeExclude:
#   - some-package   # urgent security fix — PR link and date

# Install scripts are blocked unless listed (pnpm 12: `allowBuilds`, replaces
# `ignoredBuiltDependencies` / `onlyBuiltDependencies`). These packages work without theirs:
allowBuilds:
  sharp: false # prebuilt binaries ship as optional dependencies
  unrs-resolver: false # same
  lefthook: false # hooks are installed by the "prepare" script instead
  esbuild: false # platform binary ships as an optional dependency

# Temporary audit exemptions (15-git-ve-ci §6): reason + date, reviewed by the date below.
auditConfig:
  ignoreGhsas:
    # braces ≤ 3.0.3 (high, ReDoS-style stack exhaustion). Dev-only path:
    # eslint-config-next → @next/eslint-plugin-next → fast-glob → micromatch → braces.
    # No patched version exists (2026-10-16). Runs only on our own lint globs, never on user input.
    # Review: 2026-11-16 or when eslint-config-next / braces ships a fix.
    - GHSA-vfj7-8cjw-p6xm
    # shadcn CLI (devDependency, never imported by app code or run in CI/build; added only so a
    # developer can run `pnpm exec shadcn add …` locally). Its bundled MCP registry server pulls
    # an old zod/express/undici/systeminformation chain through @modelcontextprotocol/sdk and
    # @dotenvx/dotenvx; `pnpm why zod` confirms the app's own zod resolves to 4.6.7 (patched),
    # separate from shadcn's pinned 3.25.76. Bumping to shadcn@4.23.0 (2026-11-04) made this
    # worse, not better (2026-10-27 advisories). Review: 2026-12-04 or when shadcn drops dotenvx.
    - GHSA-mrhx-c7xc-m3w5 # zod — oversized collection validation DoS, shadcn's own 3.25.76 only
    - GHSA-27r3-jxmh-p828 # body-parser — compressed body DoS, shadcn's bundled MCP server only
    - GHSA-xjj6-f33q-929c # undici — DoS via excessive content-encodings
    - GHSA-4w7w-5xrc-9h26 # undici — cache poisoning via cross-origin redirects
    - GHSA-2m5v-pch6-74hx # undici — TLS cert validation bypass via dropped Agent options
    - GHSA-qrxm-fqhp-jwvm # undici — DoS via TLS 1.2 certificate-changing renegotiation
    - GHSA-3f7j-7jwc-fxfj # systeminformation — Windows command injection in services()
