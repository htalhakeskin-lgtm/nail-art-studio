<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Mockup</title>
    <!--
  Device mockup composer (19-portfolyo §4). Opened by mockup.mjs with query parameters:
    duzen    kapak (2560×1600) | kare (1200×1200) | dikey (1080×1350) | uclu (2560×1600)
    masaustu desktop screenshot URL (1440×900 @2x recommended)
    telefon, telefon2, telefon3   phone screenshot URLs (390×844 @3x recommended)
    zemin    background colour (default: deep warm charcoal)
  Frames are drawn with CSS, so there is no third-party device artwork to license.
-->
    <style>
      :root {
        --bg: #141210;
        --frame: #1f1d1b;
        --frame-edge: #3a3734;
        --bar: #2a2826;
        --pill: #3b3936;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        background: var(--bg);
      }
      .stage {
        position: relative;
        overflow: hidden;
        width: var(--w);
        height: var(--h);
        background:
          radial-gradient(
            120% 90% at 30% 20%,
            color-mix(in oklab, var(--bg), white 7%) 0%,
            transparent 60%
          ),
          radial-gradient(
            90% 80% at 85% 90%,
            color-mix(in oklab, var(--bg), black 25%) 0%,
            transparent 70%
          ),
          var(--bg);
      }
      .shadow {
        box-shadow:
          0 calc(var(--u) * 3) calc(var(--u) * 8) rgb(0 0 0 / 0.55),
          0 calc(var(--u) * 0.6) calc(var(--u) * 1.6) rgb(0 0 0 / 0.35);
      }

      /* Desktop browser window */
      .browser {
        position: absolute;
        border-radius: calc(var(--u) * 0.9);
        background: var(--frame);
        overflow: hidden;
        border: 1px solid var(--frame-edge);
      }
      .browser .chrome {
        height: calc(var(--u) * 2.6);
        background: var(--bar);
        display: flex;
        align-items: center;
        padding: 0 calc(var(--u) * 1.2);
        gap: calc(var(--u) * 0.55);
        position: relative;
      }
      .browser .dot {
        width: calc(var(--u) * 0.8);
        height: calc(var(--u) * 0.8);
        border-radius: 50%;
      }
      .browser .dot:nth-child(1) {
        background: #ff5f57;
      }
      .browser .dot:nth-child(2) {
        background: #febc2e;
      }
      .browser .dot:nth-child(3) {
        background: #28c840;
      }
      .browser .address {
        position: absolute;
        left: 30%;
        right: 30%;
        height: calc(var(--u) * 1.5);
        border-radius: 999px;
        background: var(--pill);
      }
      .browser .screen {
        position: absolute;
        top: calc(var(--u) * 2.6);
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
      }

      /* Phone */
      .phone {
        position: absolute;
        aspect-ratio: 390 / 844;
        border-radius: calc(var(--pw) * 0.15);
        background: #0b0b0c;
        padding: calc(var(--pw) * 0.028);
        border: calc(var(--pw) * 0.006) solid #4a4744;
      }
      .phone .screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: calc(var(--pw) * 0.125);
        overflow: hidden;
        background: #fff;
      }
      /* No camera cut-out: Playwright screenshots have no status bar, so an island would hide content. */

      .screen img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const layouts = {
        // Values are percentages of the stage. Mirrors the reference cover: laptop left, phone overlapping bottom-right.
        kapak: {
          w: 2560,
          h: 1600,
          browser: { left: 5.9, top: 9.8, width: 75 },
          phones: [{ right: 5.2, bottom: 6.2, height: 76 }],
        },
        kare: {
          w: 1200,
          h: 1200,
          browser: { left: 5, top: 10, width: 82 },
          phones: [{ right: 5, bottom: 9, height: 61 }],
        },
        dikey: {
          w: 1080,
          h: 1350,
          browser: { left: 4, top: 13, width: 84 },
          phones: [{ right: 6, bottom: 9, height: 60 }],
        },
        uclu: {
          w: 2560,
          h: 1600,
          browser: null,
          phones: [
            { left: 12, top: 12, height: 76 },
            { left: 39.5, top: 8, height: 84 },
            { left: 67, top: 12, height: 76 },
          ],
        },
      };
      const layout = layouts[params.get("duzen") ?? "kapak"] ?? layouts.kapak;
      const stage = document.getElementById("stage");
      const unit = layout.w / 100; // 1% of the stage width, used for chrome sizes
      stage.style.setProperty("--w", `${layout.w}px`);
      stage.style.setProperty("--h", `${layout.h}px`);
      stage.style.setProperty("--u", `${unit}px`);
      if (params.get("zemin"))
        document.documentElement.style.setProperty("--bg", params.get("zemin"));

      const image = (src) => (src ? `<img src="${src}" alt="">` : "");
      const pct = (box, key, total) =>
        box[key] === undefined ? "" : `${key}:${(box[key] / 100) * total}px;`;

      if (layout.browser && params.get("masaustu")) {
        const b = layout.browser;
        const width = (b.width / 100) * layout.w;
        const chrome = unit * 2.6;
        const height = width / 1.6 + chrome; // 16:10 viewport (1440×900) plus the toolbar
        stage.insertAdjacentHTML(
          "beforeend",
          `<div class="browser shadow" style="left:${(b.left / 100) * layout.w}px;top:${(b.top / 100) * layout.h}px;width:${width}px;height:${height}px">
         <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="address"></span></div>
         <div class="screen">${image(params.get("masaustu"))}</div>
       </div>`,
        );
      }

      ["telefon", "telefon2", "telefon3"].forEach((key, index) => {
        const box = layout.phones[index];
        const src = params.get(key);
        if (!box || !src) return;
        const height = (box.height / 100) * layout.h;
        const width = height * (390 / 844);
        const position =
          pct(box, "left", layout.w) +
          pct(box, "right", layout.w) +
          pct(box, "top", layout.h) +
          pct(box, "bottom", layout.h);
        stage.insertAdjacentHTML(
          "beforeend",
          `<div class="phone shadow" style="${position}height:${height}px;width:${width}px;--pw:${width}px">
         <div class="screen">${image(src)}</div>
       </div>`,
        );
      });

      Promise.all([...document.images].map((img) => img.decode().catch(() => {}))).then(() => {
        document.body.dataset.ready = "true";
      });
    </script>
  </body>
</html>
